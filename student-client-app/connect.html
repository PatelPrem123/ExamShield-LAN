<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect to ExamShield Host</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-6 font-sans">
  <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-2xl text-center space-y-6">
    <div class="space-y-3 flex flex-col items-center">
      <img src="logo.png" alt="ExamShield LAN" class="w-20 h-20 rounded-2xl shadow-xl border-2 border-indigo-500/40 object-cover" />
      <div>
        <h1 class="text-xl font-bold">ExamShield LAN Client</h1>
        <p class="text-xs text-slate-400">Dedicated Secure Examination Mode</p>
      </div>
    </div>

    <form onsubmit="handleConnect(event)" class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
          Host Server Address (IP:Port)
        </label>
        <input type="text" id="hostInput" required placeholder="e.g. 192.168.1.15:3000"
          class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-mono" />
        <p class="text-[11px] text-slate-400 mt-1">Ask your instructor for the Host Server IP address displayed on their screen.</p>
      </div>

      <button type="submit"
        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg transition active:scale-95">
        🔒 Connect & Enter Locked Kiosk
      </button>
    </form>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    document.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) || (e.ctrlKey && ['u', 'U', 's', 'S'].includes(e.key))) {
        e.preventDefault();
      }
    });

    function handleConnect(e) {
      e.preventDefault();
      const host = document.getElementById('hostInput').value.trim();
      if (!host) return;
      ipcRenderer.send('connect_to_server', host);
    }
  </script>
</body>
</html>
